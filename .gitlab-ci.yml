default:
  image: python:3.11-slim          
  tags: [geocontrol]               # Job running on geocontrol Runner
  before_script:
    - python -m pip install --no-cache-dir --upgrade pip

stages: [lint, test, e2e]

# ---------- LINT ----------
lint:
  script:
    - python -m pip install --no-cache-dir pre-commit==4.2.0
    - pre-commit run --all-files --color always
  timeout: 10m                     # Avoid timeout

# ---------- UNIT TEST ----------
unit-test:
  script:
    - python -m pip install --no-cache-dir pytest fastapi httpx redis \
        opencv-python-headless numpy mediapipe
    - pytest -q
  timeout: 20m

# ---------- E2E SMOKE ----------
e2e-home-safety:
  image: docker:24                 
  services: [docker:dind]
  variables:
    DOCKER_HOST: tcp://docker:2375 # use plain TCP 2375 and disable TLS
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apk add --no-cache curl      # curl is not included in the Alpine image
  script:
    - docker compose -f ops/compose/docker-compose.dev.yml up -d --build home-safety-svc redis
    - ./ops/scripts/smoke_hs.sh
  after_script:
    - docker compose -f ops/compose/docker-compose.dev.yml down -v
  timeout: 20m
