default:
  image: python:3.11-slim
  tags: [luna]
  retry:
    max: 2
    when: [runner_system_failure, script_failure]

stages: [lint, test, e2e]

# ---------- LINT ----------
lint:
  stage: lint
  tags: [luna]
  before_script:
    - apt-get update -y && apt-get install -y --no-install-recommends git
    - python -m pip install --no-cache-dir pre-commit==4.2.0
  script: pre-commit run --all-files --color always
  timeout: 10m

# ---------- UNIT TEST ----------
unit-test:
  stage: test
  tags: [luna]
  before_script:
    # A. OpenCV run-time dependency
    - apt-get update && apt-get install -y --no-install-recommends libgl1
    # B. Python dependency
    - python -m pip install --no-cache-dir pytest fastapi httpx redis \
        mediapipe==0.10.21 opencv-python-headless
    # C. PYTHONPATH for imports
    - export PYTHONPATH="$PWD/server/health-svc:$PWD/server/home-safety-svc:$PWD/server/notification-svc:$PWD/server/tele-assist-svc:$PWD/server/tv-svc"
  script:
    - pytest -q server/*/tests
  timeout: 20m

# ---------- E2E SMOKE ----------
e2e-home-safety:
  stage: e2e
  image: docker:24
  services: [docker:dind]
  tags: [luna]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  before_script:
    - apk add --no-cache curl
  script:
    - docker compose -f ops/compose/docker-compose.dev.yml up -d --build home-safety-svc redis
    - ./ops/scripts/smoke_hs.sh
  after_script:
    - docker compose -f ops/compose/docker-compose.dev.yml down -v || true
  timeout: 20m
