default:  
  image: python:3.11-slim
  tags: [geocontrol]
  retry:
    max: 2
    when: [runner_system_failure]

stages: [lint, test, e2e]

# ---------- LINT ----------
lint:
  stage: lint
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git    # install git for pre-commit internals
  script:
    - python -m pip install --no-cache-dir pre-commit==4.2.0
    - pre-commit run --all-files --color always
  timeout: 10m                                    # avoid timeout

# ---------- UNIT TEST ----------
unit-test:
  stage: test
  before_script:
    # A. OpenCV run-time dependency
    - apt-get update && apt-get install -y --no-install-recommends libgl1
    # B. Python dependency
    - python -m pip install --no-cache-dir pytest fastapi httpx redis \
        mediapipe==0.10.21 opencv-python-headless
    # C. Put the 5 microservice directories into PYTHONPATH so that `from app.main import ...` can be resolved
    - export PYTHONPATH="$PWD/server/health-svc:$PWD/server/home-safety-svc:$PWD/server/notification-svc:$PWD/server/tele-assist-svc:$PWD/server/tv-svc"
  script:
    - pytest -q server/*/tests
  timeout: 20m

# ---------- E2E SMOKE ----------
e2e-home-safety:
  stage: e2e
  image: docker:24
  services: [docker:dind]
  variables:
    DOCKER_HOST: tcp://docker:2375          # use plain TCP 2375 and disable TLS
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  before_script:
    - apk add --no-cache curl   # curl is not included in the Alpine image
  script:
    - docker compose -f ops/compose/docker-compose.dev.yml up -d --build home-safety-svc redis
    - ./ops/scripts/smoke_hs.sh
  after_script:
    - docker compose -f ops/compose/docker-compose.dev.yml down -v || true
  timeout: 20m
