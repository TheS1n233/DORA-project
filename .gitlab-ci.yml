variables:
  GIT_STRATEGY: clone
  GIT_DEPTH: 0

default:
  image: python:3.11-bookworm@sha256:c1239cb82bf08176c4c90421ab425a1696257b098d9ce21e68de9319c255a47d
  tags: [geocontrol]
  retry:
    max: 2
    when: [runner_system_failure, script_failure]

stages: [lint, test, e2e]

# ---------- LINT ----------
lint:
  stage: lint
  before_script:
    - echo "Runner = $CI_RUNNER_DESCRIPTION"
    - if [[ "$CI_RUNNER_DESCRIPTION" == mac* ]]; then
        echo "Mac runner lacks Docker daemon — abort & retry";
        exit 1;
      fi
    - apt-get update -y && apt-get install -y --no-install-recommends git
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - git remote add origin "$CI_REPOSITORY_URL" || true
    - python -m pip install --no-cache-dir pre-commit==4.2.0
  script:
    - pre-commit run --all-files --color always
  timeout: 10m

# ---------- UNIT TEST ----------
unit-test:
  stage: test
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends libgl1
    - python -m pip install --no-cache-dir pytest fastapi httpx redis \
        mediapipe==0.10.21 opencv-python-headless
    - export PYTHONPATH="$PWD/server/health-svc:$PWD/server/home-safety-svc:$PWD/server/notification-svc:$PWD/server/tele-assist-svc:$PWD/server/tv-svc"
  script:
    - pytest -q server/*/tests
  timeout: 20m

# ---------- E2E SMOKE ----------
e2e-home-safety:
  stage: e2e
  image: docker:24
  services:
    - name: docker:24-dind   # background daemon
      command: ["--tls=false"]  # turn off TLS
  variables:
    # tell CLI to find dind，and turn off the default TLS mechanism
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - apk add --no-cache curl
    - docker info            
    - docker compose -f ops/compose/docker-compose.dev.yml up -d --build home-safety-svc redis

  privileged: true