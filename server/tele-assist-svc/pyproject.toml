[tool.poetry]
name = "tele-assist-svc"
version = "0.1.0"
description = "DORA tele-assist console"
authors = ["DORA Project"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}

[tool.poetry.scripts]
ta = "app.main:run"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
