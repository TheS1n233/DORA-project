# ops/compose/docker-compose.hm.yml
# Health Monitoring services for DORA project

services:
  influxdb:
    image: influxdb:2.7
    container_name: compose-influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=admin123
      - DOCKER_INFLUXDB_INIT_ORG=dora
      - DOCKER_INFLUXDB_INIT_BUCKET=vitals
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=dev-token
    volumes:
      - influx-data:/var/lib/influxdb2
    networks: [dora-net]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: compose-redis
    ports:
      - "6379:6379"
    networks: [dora-net]
    restart: unless-stopped

  health-svc:
    container_name: compose-health-svc
    image: compose-health-svc
    build:
      context: ../../health_monitoring_service
      dockerfile: Dockerfile
    ports:
      - "8089:8080"
    env_file:
      - ../../health_monitoring.env
    depends_on:
      - influxdb
      - redis
    networks: [dora-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/docs || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6

  ha-mqtt-bridge:
    container_name: compose-ha-mqtt-bridge
    image: compose-ha-mqtt-bridge
    build:
      context: ../../home_assistant_integration
      dockerfile: Dockerfile
    environment:
      - MQTT_BROKER=compose-mosquitto-1
      - MQTT_PORT=1883
      - HM_SERVICE_URL=http://health-svc:8080
      - USER_ID=user-001
    depends_on:
      - health-svc
    networks: [dora-net]
    restart: unless-stopped

  ha-device-simulator:
    container_name: compose-ha-device-simulator
    image: compose-ha-mqtt-bridge
    build:
      context: ../../home_assistant_integration
      dockerfile: Dockerfile
    command: ["python", "/app/ha_device_simulator.py"]
    environment:
      - MQTT_BROKER=compose-mosquitto-ha
      - MQTT_PORT=1883
    networks: [dora-net]
    restart: "no"  # Run once for testing

volumes:
  influx-data:

networks:
  dora-net:
    external: true
    name: compose_dora-net