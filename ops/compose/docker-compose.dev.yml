networks:
  dora-net:
    driver: bridge

services:
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=dora
      - POSTGRES_PASSWORD=dora
      - POSTGRES_DB=dora
      - TZ=Europe/Rome
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dora"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [dora-net]

  redis:
    image: redis:7-alpine
    networks: [dora-net]

  influxdb:
    image: influxdb:2
    networks: [dora-net]

  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    networks: [dora-net]

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    environment:
      - TZ=Europe/Rome
    volumes:
      - ha-config:/config
    networks: [dora-net]

  home-safety-svc:
    build:
      context: ../../server/home-safety-svc
    container_name: compose-home-safety-svc
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8001
    volumes:
      - ../../server/home-safety-svc:/app
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - redis
    ports:
      - "8001:8001"  
  health-svc:
    build: ../../server/health-svc
    depends_on: [postgres, influxdb]
    networks: [dora-net]

  tv-svc:
    build: ../../server/tv-svc
    networks: [dora-net]

  tele-assist-svc:
    build: ../../server/tele-assist-svc
    networks: [dora-net]

  notification-svc:
    build: ../../server/notification-svc
    depends_on: [redis]
    networks: [dora-net]

volumes:
  pgdata:
  ha-config:
