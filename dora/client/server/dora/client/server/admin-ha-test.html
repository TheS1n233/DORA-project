<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>DORA 管理员端 - HA 数据读取（REST GET）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Microsoft YaHei", sans-serif; margin: 24px; }
    h1 { margin-bottom: 8px; }
    .row { margin: 8px 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    input { padding: 6px 8px; width: 360px; }
    button { padding: 8px 16px; border-radius: 8px; cursor: pointer; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin-top: 12px; }
    .card { border: 1px solid #e5e7eb; border-radius: 10px; padding: 12px; }
    .k { color: #555; }
    .v { font-weight: 700; font-size: 20px; }
    .unit { color:#6b7280; margin-left: 6px; }
    .time { color:#6b7280; font-size:12px; margin-top:6px; }
    pre { background:#111; color:#0f0; padding:12px; border-radius:8px; white-space:pre-wrap; }
  </style>
</head>
<body>
  <h1>DORA 管理员端 - HA 数据读取（REST GET）</h1>

  <div class="row">
    <label>Bridge 基址：</label>
    <input id="base" value="http://localhost:9099" />
    <button id="btnRefresh">刷新一次</button>
    <button id="btnAuto">开始自动刷新</button>
    <span id="status"></span>
  </div>

  <div class="grid" id="cards"></div>

  <h3>原始响应</h3>
  <pre id="raw">（等待数据……）</pre>

  <script>
    // Simple viewer to call the Node bridge and render vital sensors.
    const $ = (id) => document.getElementById(id);
    let timer = null;

    async function loadOnce() {
      const base = $('base').value.trim().replace(/\/+$/, '');
      $('status').textContent = '加载中…';
      try {
        const r = await fetch(`${base}/ha/health/summary`, { cache: 'no-store' });
        if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
        const data = await r.json();
        $('raw').textContent = JSON.stringify(data, null, 2);
        render(data.summary);
        $('status').textContent = '完成';
      } catch (e) {
        $('status').textContent = '错误：' + e.message;
      }
    }

    function render(summary) {
      const container = $('cards');
      container.innerHTML = '';
      Object.keys(summary).forEach(key => {
        const item = summary[key];
        const div = document.createElement('div');
        div.className = 'card';
        if (item && !item.error) {
          div.innerHTML = `
            <div class="k">${item.friendly_name || key}</div>
            <div class="v">${item.value}<span class="unit">${item.unit || ''}</span></div>
            <div class="time">${item.last_changed ? ('更新时间：' + item.last_changed) : ''}</div>
            <div class="time">${key}</div>
          `;
        } else {
          div.innerHTML = `
            <div class="k">${key}</div>
            <div class="v">读取失败</div>
            <div class="time">${item && item.error ? item.error : ''}</div>
          `;
        }
        container.appendChild(div);
      });
    }

    $('btnRefresh').onclick = loadOnce;

    $('btnAuto').onclick = () => {
      if (timer) {
        clearInterval(timer);
        timer = null;
        $('btnAuto').textContent = '开始自动刷新';
        $('status').textContent = '已停止自动刷新';
      } else {
        loadOnce();
        timer = setInterval(loadOnce, 5000);
        $('btnAuto').textContent = '停止自动刷新';
        $('status').textContent = '自动刷新中（每5秒）';
      }
    };
  </script>
</body>
</html>
